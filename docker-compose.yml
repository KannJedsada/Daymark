name: daymark

services:
  db:
    image: alpine:3.20
    container_name: daymark-db
    volumes:
      - ./data:/data
      - ./database/init.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache sqlite > /dev/null
        mkdir -p /data
        sqlite3 /data/daymark.sqlite < /init.sql
        echo "SQLite ready at ./data/daymark.sqlite"
        exec tail -f /dev/null
    restart: unless-stopped
